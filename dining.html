<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Campus Life Super App | Dining</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">  
  <link rel="stylesheet" href="css/style.css">  
</head>
<body>
<header>
  <nav class="navbar navbar-expand-md navbar-dark site-nav" aria-label="Main navigation">
    <div class="container">
      <a class="navbar-brand" href="index.html">Campus Life</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
              data-bs-target="#navMenu" aria-controls="navMenu" aria-expanded="false"
              aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link active" aria-current="page" href="dining.html">Dining</a></li>
          <li class="nav-item"><a class="nav-link" href="map.html">Map</a></li>
        </ul>
      </div>
    </div>
  </nav>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
  </head>
  <main id="main" class="container py-5">
  <h1 class="mb-2">Dining</h1>
  <p class="text-muted mb-4">Meal ideas to help you decide what to eat. These are general recipes, not the dining hall menu.</p>

  <!-- Filter bar: search by name or choose a category -->
  <form id="meal-form" class="row g-3 align-items-end mb-4">
    <div class="col-md-5">
      <label for="meal-search" class="form-label">Search by meal name</label>
      <input type="search" id="meal-search" class="form-control" placeholder="For example: pasta">
    </div>
    <div class="col-md-4">
      <label for="category-select" class="form-label">Category</label>
      <!-- JavaScript will fill in the options in Step 8 -->
      <select id="category-select" class="form-select">
        <option value="">Loading categories...</option>
      </select>
    </div>
    <div class="col-md-3">
      <button type="submit" class="btn btn-brick w-100">Search meals</button>
    </div>
  </form>

  <p id="meal-status" aria-live="polite" class="text-muted"></p>

  <!-- JavaScript will put one card per meal here in Step 8 -->
  <div id="meal-grid" class="row g-4"></div>
</main>

<footer class="site-footer">
  <div class="container">
    <p class="mb-1">Campus Life Super App</p>
    <p class="mb-0 small">Weather data from Open-Meteo. Meal data from TheMealDB. Map data from OpenStreetMap contributors.</p>
  </div>
</footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
